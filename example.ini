[general]
# timeout for fetching data from net 
timeout=5000
# TODO
max-try=3

# Final merged playlist sampling method: head or random
sample=head
# Final merge algorithm:
# uniform | proportional | weighted | priority | round_robin | reservoir
merge=round_robin


[lastfm]
username=XXX
security-profile=chrome116
# api or web
method=api
# Only used when general merge=weighted.
# Both lastfmapi and lastfmweb use this weight.
merge_weight=1.0

[lastfm.api]
base-url=https://ws.audioscrobbler.com/2.0/
key='XXXXXXXXXXXXXXXXXXXXXXXX'
period=1week
diffusion=3
# dfs or bfs
strategy=dfs
# Last.fm API diffusion sampling method: topn or random
sample=random
random-sample-lambda=5.0
diffusion-lambda=0.25
score-beta=10.0
# Optional: overrides [lastfm] merge_weight when merge=weighted.
# Defaults to [lastfm] merge_weight when omitted.
merge_weight=1.0


[lastfm.web]
base-url=https://www.last.fm
recomm-path=/player/station/user/{username}/recommended
recomm-method=GET
recomm-accept=application/json, text/javascript, */*; q=0.01
# Optional: overrides [lastfm] merge_weight when merge=weighted.
# Defaults to [lastfm] merge_weight when omitted.
merge_weight=1.0

[ncm]
# nickname to ensure logining into right acccount
# for its hard to get userid for a user
username='XXXXX'
# File containing the Netease Music login cookie.
# Relative paths are resolved from the mxrec working directory.
cookie-file=.ncm-cookie
# http or socket
bind-method=http
bind-address=127.0.0.1
# bind-method=socket
# bind-address=/tmp/mxrec.socket
port=9900
# Directory containing lib/netease/server.js and node_modules.
# Relative paths are resolved from the mxrec working directory.
work-dir=lib/netease
# Only used when general merge=weighted.
merge_weight=1.0
